# GreenNode STA uplink — onboard radio (wlan0)
# This connects GreenNode outward to the greenhouse site's WiFi network
# (internet/backend reach). Fill in CHANGE_ME values.

ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
country=LK

network={
    ssid="CHANGE_ME_upstream_ssid"
    psk="CHANGE_ME_upstream_passphrase"
    key_mgmt=WPA-PSK
    priority=1
}

# Add additional network={} blocks here for secondary/fallback sites
# (e.g. a farmer's backup mobile hotspot) — wpa_supplicant will pick the
# highest-priority network currently in range.
