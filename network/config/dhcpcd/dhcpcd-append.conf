# Append this block to /etc/dhcpcd.conf on the RPi4.
# wlan0 is left alone (DHCP client, managed by wpa_supplicant) — GreenNode's
# uplink identity comes from whatever the upstream router assigns it.
# The three AP interfaces get static IPs and don't run a DHCP client
# themselves (they're the DHCP *server*, via dnsmasq).

interface wlan1
static ip_address=10.0.10.1/24
nohook wpa_supplicant

interface wlan1_1
static ip_address=10.0.11.1/24
nohook wpa_supplicant

interface wlan1_2
static ip_address=10.0.12.1/24
nohook wpa_supplicant

# NEW: provisioning subnet — fixed gateway IP the ESP32 hardcodes as the
# target for its one provisioning HTTP call, no discovery needed.
interface wlan1_3
static ip_address=10.0.13.1/24
nohook wpa_supplicant

# NEW: hub-uplink setup subnet — farmer's phone lands here to give
# GreenNode its own internet credentials. Served by its own standalone
# dnsmasq instance (config/dnsmasq/dnsmasq-setup.conf), not the main one.
interface wlan1_4
static ip_address=10.0.14.1/24
nohook wpa_supplicant
