# GreenNode MQTT broker config.
# No anonymous access — every publisher/subscriber is a named user with a
# password (per-device, issued at provisioning) and scoped ACL entries.
# Password file and ACL file are both regenerated/appended by
# scripts/generate-mqtt-creds.sh (bulk, from registry/devices.csv) and by
# pairing_watcher.py (single new device, at the moment it's paired).

per_listener_settings true

listener 1883
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.d/greennode.acl

persistence true
persistence_location /var/lib/mosquitto/

log_dest syslog
log_type error
log_type warning
log_type notice
