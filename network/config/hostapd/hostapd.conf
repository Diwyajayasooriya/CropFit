# GreenNode AP radio — USB WiFi adapter (pinned to wlan1 via udev rule)
# Multi-BSS: sensors / actuators / admin, each own SSID + subnet.
# Fill in CHANGE_ME values before first boot.

country_code=LK
interface=wlan1
driver=nl80211

# --- BSS0: sensors (primary interface) ---
ssid=greennode-sensors
hw_mode=g
channel=1
ieee80211n=1
wmm_enabled=1

auth_algs=1
wpa=2
wpa_passphrase=CHANGE_ME_sensors_passphrase
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Clients on this SSID can't see/talk to each other directly (L2 isolation
# within the BSS itself — separate from the L3 inter-subnet rules in nftables)
ap_isolate=1

ignore_broadcast_ssid=0
macaddr_acl=0

# --- BSS1: actuators ---
bss=wlan1_1
ssid=greennode-actuators
wpa=2
wpa_passphrase=CHANGE_ME_actuators_passphrase
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
ap_isolate=1
auth_algs=1
ignore_broadcast_ssid=0

# --- BSS2: admin ---
bss=wlan1_2
ssid=greennode-admin
wpa=2
wpa_passphrase=CHANGE_ME_admin_passphrase
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
ap_isolate=1
auth_algs=1
ignore_broadcast_ssid=0

# --- BSS3: provisioning (NEW) ---
# Fixed passphrase baked into every ESP32's firmware image before
# deployment. This network is deliberately low-trust: nftables locks it
# down to reach nothing but the pairing service's port on GreenNode
# itself (see scripts/nftables-rules.sh). The real access control is the
# pairing WINDOW (opened only after an operator re-authenticates in the
# frontend), not this passphrase — see README.md Part 3.
bss=wlan1_3
ssid=greennode-provision
wpa=2
wpa_passphrase=CHANGE_ME_provisioning_passphrase
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
ap_isolate=1
auth_algs=1
ignore_broadcast_ssid=0

# --- BSS4: hub-uplink setup (NEW) ---
# Lets a freshly unboxed GreenNode receive its OWN internet credentials
# from the farmer, before it has any — solves the chicken-and-egg problem
# where wlan0 (STA uplink) needs the farm's WiFi password, but there was
# previously no way to give it one without the hub already being online.
# The farmer connects a phone to this SSID and is walked through a
# captive-portal setup page (see network.md Section 1.14 and
# scripts/uplink_provisioning.py).
#
# IMPORTANT — unlike the three passphrases above and the fixed
# provisioning passphrase below (BSS3), this one must be UNIQUE PER UNIT,
# generated at flash time and printed on the device's physical label.
# There's no operator-gated "pairing window" on this network the way
# there is for sub-node provisioning (Section 1.12) — physical possession
# of the unit plus reading its label IS the entire access control here.
# A shared passphrase across units would let anyone who has ever seen one
# GreenNode's label reconfigure every other farmer's hub from outside.
bss=wlan1_4
ssid=greennode-setup
wpa=2
wpa_passphrase=CHANGE_ME_PER_UNIT_setup_passphrase
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
ap_isolate=1
auth_algs=1
ignore_broadcast_ssid=0

# Logging (useful while bringing this up, trim later)
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# hostapd_cli control socket — needed for the shedding daemon's deauth calls
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
