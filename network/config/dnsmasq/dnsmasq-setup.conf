# Standalone dnsmasq instance for the hub-uplink setup network (wlan1_4,
# greennode-setup, 10.0.14.0/24) — deliberately a SEPARATE process from
# the main dnsmasq instance (config/dnsmasq/dnsmasq.conf) serving the
# sensor/actuator/admin/sub-node-provisioning subnets.
#
# Why separate rather than one more `interface=`/`dhcp-range=` block in
# the main config: this network needs a wildcard DNS answer (every
# hostname -> GreenNode itself), and dnsmasq's `address=` directive is
# process-global, not scoped to one interface. Adding it to the main
# instance would wildcard-hijack DNS for the sensor/actuator/admin
# subnets too, breaking anything on them that does real name resolution.
# A second, fully independent instance keeps the blast radius to exactly
# this one interface.

interface=wlan1_4
bind-interfaces
except-interface=wlan0
except-interface=wlan1
except-interface=wlan1_1
except-interface=wlan1_2
except-interface=wlan1_3
except-interface=lo

# Short-ish lease: farmer's phone only needs this for the minute or two
# setup takes, but unlike wlan1_3's transient sub-nodes, a farmer may
# disconnect and reconnect a few times while entering their password —
# 15m avoids the phone appearing to "lose" the reservation mid-retry.
dhcp-range=10.0.14.10,10.0.14.100,255.255.255.0,15m
dhcp-option=option:router,10.0.14.1
dhcp-option=option:dns-server,10.0.14.1

# The wildcard. Every DNS query on this interface, for any domain, gets
# GreenNode's own IP back. This is what makes iOS/Android/Windows
# captive-portal-detection probes (which query real hostnames like
# connectivitycheck.gstatic.com or captive.apple.com) land on our own
# setup HTTP server instead of hanging until they time out — this subnet
# has no forwarding at all (see scripts/nftables-rules.sh), so without
# this wildcard, every probe would just stall against a real IP it can
# never actually reach.
address=/#/10.0.14.1

# Own PID and lease files — never share these with the main instance.
pid-file=/var/run/dnsmasq-greennode-setup.pid
dhcp-leasefile=/var/lib/misc/dnsmasq-greennode-setup.leases

# Pure local resolver for this subnet, nothing upstream.
no-resolv
no-hosts
log-dhcp
