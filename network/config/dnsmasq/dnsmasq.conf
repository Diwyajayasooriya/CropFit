# GreenNode DHCP — one scope per AP subnet. Only serves the three AP
# interfaces; never touches wlan0 (that's a client of someone else's DHCP).

# Only bind to interfaces listed below, ignore all others (incl. wlan0)
bind-interfaces
except-interface=wlan0
except-interface=lo

interface=wlan1
interface=wlan1_1
interface=wlan1_2
interface=wlan1_3

# --- sensors: 10.0.10.0/24 ---
dhcp-range=set:sensors,10.0.10.10,10.0.10.200,255.255.255.0,12h
dhcp-option=tag:sensors,option:router,10.0.10.1
dhcp-option=tag:sensors,option:dns-server,10.0.10.1

# --- actuators: 10.0.11.0/24 ---
dhcp-range=set:actuators,10.0.11.10,10.0.11.200,255.255.255.0,12h
dhcp-option=tag:actuators,option:router,10.0.11.1
dhcp-option=tag:actuators,option:dns-server,10.0.11.1

# --- admin: 10.0.12.0/24 ---
dhcp-range=set:admin,10.0.12.10,10.0.12.200,255.255.255.0,12h
dhcp-option=tag:admin,option:router,10.0.12.1
dhcp-option=tag:admin,option:dns-server,10.0.12.1

# --- provisioning: 10.0.13.0/24 (NEW) ---
# Short lease time deliberately — devices only sit here for the seconds it
# takes to hand off real credentials, then reconnect to their real subnet.
dhcp-range=set:provision,10.0.13.10,10.0.13.200,255.255.255.0,5m
dhcp-option=tag:provision,option:router,10.0.13.1
dhcp-option=tag:provision,option:dns-server,10.0.13.1

# pairing_watcher.py reads /var/lib/misc/dnsmasq.leases directly to map a
# provisioning request's source IP back to the MAC hostapd saw associate —
# no extra config needed here, dnsmasq writes that file by default.

# Static MAC->IP reservations, generated from registry/devices.csv by
# scripts/generate-dhcp-hosts.sh — do not hand-edit this include, edit the
# CSV and re-run the generator instead.
conf-file=/etc/dnsmasq.d/greennode-hosts.conf

# Don't act as a general-purpose resolver beyond the AP subnets
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=8.8.8.8

log-dhcp
